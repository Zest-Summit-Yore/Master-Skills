name: Organize uploaded skills

on:
  push:
    paths:
      - skills-bundle.zip
      - .github/workflows/unpack-skills.yml

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Replace flattened upload with nine skill sections
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f skills-bundle.zip ]; then
            exit 0
          fi
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name 'skills-bundle.zip' \
            -exec rm -rf {} +
          unzip -q skills-bundle.zip -d .
          rm -f skills-bundle.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: organize synced skills into nine sections"
          git push
